# Theme configuration
############################################

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
logo = "assets/logo/logo_transp.png"
favicon = "assets/logo/logo_transp.png"

language = "en"
scheme = "gifmi"

features = [
  # --- Announcements ---
  "announce.dismiss",          # Allow users to close/dismiss the top announcement bar

  # --- Content & Page Actions ---
  "content.action.edit",       # Add an "Edit this page" pencil icon button (requires repo_url & edit_uri)
  "content.action.view",       # Add a "View source of this page" code icon button
  "content.code.annotate",     # Enable interactive callout annotations inside code blocks
  "content.code.copy",         # Show a "Copy to clipboard" button on all code blocks
  "content.code.select",       # Show a button to select/exclude prompt symbols (e.g., `$` or `>>>`) when copying code
  "content.footnote.tooltips", # Render footnote references as hoverable tooltips instead of jumping to the bottom
  "content.tabs.link",         # Synchronize tab selection across the entire site (e.g., switching all tabs from Python to Bash at once)
  "content.tooltips",          # Upgrade standard HTML title attributes into styled, rich tooltips

  # --- Header & Footer ---
  # "header.autohide",           # Automatically hide the top header bar when scrolling down and reveal it when scrolling up
  
  # --- Navigation & Sidebar ---
  "navigation.footer",         # Display Previous / Next page links in the bottom footer
  # "navigation.expand",         # Expand all collapsible subsections in the left sidebar by default
  #"navigation.indexes",        # Allow section index pages (index.md) to be attached directly to section titles
  "navigation.instant",        # Enable instant XHR page loading without full browser reloads (SPA-like behavior)
  "navigation.instant.prefetch", # Pre-fetch pages in the background when hovering over links (requires navigation.instant)
  "navigation.instant.progress", # Display a thin loading progress bar at the top during slow instant page transitions
  "navigation.path",           # Render breadcrumb navigation above the page title
  "navigation.prune",          # Only render visible navigation items in the HTML to speed up builds on very large sites
 # "navigation.sections",       # Render top-level sidebar items as bold, non-collapsible section headers
 # "navigation.tabs",           # Move top-level navigation sections into horizontal tabs below the header
 # "navigation.tabs.sticky",    # Keep navigation tabs pinned to the top when scrolling down (requires navigation.tabs)
  "navigation.top",            # Show a floating "Back to top" button when scrolling up
  "navigation.tracking",       # Automatically update the URL hash in the address bar with the currently visible anchor heading

  # --- Search ---
  "search.highlight",          # Highlight all occurrences of search terms on the target page after clicking a search result
  "search.share",              # Add a "Share" button to search results to copy a direct link to the search query
  "search.suggest",            # Display autocomplete search term suggestions while typing

  # --- Table of Contents (Right Sidebar) ---
  "toc.follow",                # Automatically scroll the right-hand Table of Contents sidebar to keep the active heading in view
  "toc.integrate",             # Merge the right-hand Table of Contents directly into the left-hand navigation sidebar
]

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

# System preference
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

# GIfMI light
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "gifmi"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# GIfMI dark
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "gifmi-dark"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

