# Markdown extensions
############################################

[project.markdown_extensions]
abbr = {}                       # Abbreviations (e.g., *HTML* -> HyperText Markup Language)
admonition = {}                 # Styled callout boxes (note, warning, tip, etc.)
attr_list = {}                  # Custom HTML attributes on elements (e.g., classes, IDs)
def_list = {}                   # Term definition lists
footnotes = {}                  # Document footnotes
md_in_html = {}                 # Allow Markdown syntax inside raw HTML blocks
toc.permalink = true            # Add clickable anchor permalinks to all headings

# Advanced formatting & syntax extensions (pymdownx)
pymdownx.arithmatex.generic = true # LaTeX mathematical equations via MathJax/KaTeX
pymdownx.betterem = {}          # Improved emphasis handling (_ and *)
pymdownx.caret = {}             # Superscript / insert syntax (^^text^^)
pymdownx.details = {}           # Collapsible details/accordion blocks
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}      # Inline code syntax highlighting
pymdownx.keys = {}              # Keyboard key styling (<kbd>Ctrl</kbd>)
pymdownx.magiclink = {}         # Auto-link raw URLs and emails
pymdownx.mark = {}              # Text highlighting (==highlight==)
pymdownx.smartsymbols = {}      # Typographic symbols (arrows, dashes, fractions)
# pymdownx.snippets.base_path = "includes" # Include external markdown files

# Custom code block extensions (e.g., Mermaid diagrams)
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

pymdownx.tabbed.alternate_style = true # Tabbed content blocks
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true # Interactive checkboxes in lists (- [x])
pymdownx.tilde = {}             # Strikethrough syntax (~~text~~)

#"zensical.directives" = {}      # Enable zensical directives functionality