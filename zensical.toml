[project]

# Site configuration
############################################

site_url = "https://gifmi.github.io/docs/"
site_name = "GIfMI Documentation Hub"
site_description = ""
site_author = "Pieter Vandemaele"

copyright = """
  Copyright &copy; 2026 Pieter Vandemaele -
  <a href="#__consent">Change cookie settings</a>
"""

# docs_dir = "docs" # default
# site_dir = "site" # default

# Repository configuration
############################################

# remote_branch = "gh-pages" # default: gh-pages
# remote_name = "origin" # default: origin
repo_url = "https://github.com/GIfMI/docs/"
repo_name = "GIfMI/docs"
edit_uri = "edit/main/docs/"
# edit_uri_template = "edit/main/docs/{path}" # default: null

# Navigation
############################################

# nav = [
#   { "Get started" = "index.md" },
#   { "Markdown in 5min" = "markdown.md" },
# ]

# Extra resoures
############################################

extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

# Extra Project Metadata & Cookie Consent
############################################

[project.extra]
key = "value"
generator = false

[project.extra.consent]
title = "Cookie consent"
description = """
  We use cookies to recognize your repeated visits and preferences, as well
  as to measure the effectiveness of our documentation and whether users
  find what they're searching for. With your consent, you're helping us to
  make our documentation better.
"""
actions = [
  "accept",
  "reject",
  "manage", 
]


